services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: public
    ports:
      - "5432:5432"
    volumes:
      # 18+ keeps data in /var/lib/postgresql/18/docker, so the volume mounts one level up.
      - pgdata18:/var/lib/postgresql

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata18:
