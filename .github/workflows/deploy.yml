name: deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    # workflow_dispatch can target any branch; only dev may reach the server
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Ignored by the backend Dockerfile, which declares no build args
          build-args: |
            VITE_USE_MOCK=${{ vars.VITE_USE_MOCK || 'true' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: dev
      url: ${{ vars.APP_URL }}
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
    steps:
      - name: Check deploy variables
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::Repository variable $name is not set (see docs/deployment.md)"
              exit 1
            fi
          done
      - uses: actions/checkout@v7
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf 'Host %s\n  StrictHostKeyChecking accept-new\n  ConnectTimeout 20\n' \
            "$DEPLOY_HOST" >> ~/.ssh/config
      - name: Upload deploy files
        run: |
          ssh "$TARGET" "mkdir -p '$DEPLOY_PATH'"
          scp deploy/docker-compose.prod.yml deploy/deploy.sh "$TARGET:$DEPLOY_PATH/"
      - name: Log in to GHCR on the server
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | ssh "$TARGET" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
      - name: Roll out
        run: ssh "$TARGET" "IMAGE_TAG='${{ github.sha }}' sh '$DEPLOY_PATH/deploy.sh'"
