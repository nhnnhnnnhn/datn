name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          # Ignored by the backend Dockerfile, which declares no build args
          build-args: |
            VITE_USE_MOCK=${{ vars.VITE_USE_MOCK || 'true' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf 'Host %s\n  StrictHostKeyChecking accept-new\n  ConnectTimeout 20\n' \
            "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/config
      - name: Upload deploy files
        run: |
          ssh "$TARGET" "mkdir -p '$DEPLOY_PATH'"
          scp deploy/docker-compose.prod.yml deploy/deploy.sh "$TARGET:$DEPLOY_PATH/"
      - name: Log in to GHCR on the server
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | ssh "$TARGET" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
      - name: Roll out
        run: ssh "$TARGET" "IMAGE_TAG='${{ github.sha }}' sh '$DEPLOY_PATH/deploy.sh'"
