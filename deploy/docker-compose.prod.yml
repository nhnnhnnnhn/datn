name: vivid-learn

services:
  backend:
    image: ghcr.io/nhnnhnnnhn/datn-backend:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      ROOT_PATH: /api
      LOG_TO_CLIENT: "false"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    image: ghcr.io/nhnnhnnnhn/datn-frontend:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    networks:
      default:
      proxy:
        # Nginx Proxy Manager forwards dev-datn.nhnhn.cloud to this name
        aliases: [vivid-learn-frontend]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx_default}
