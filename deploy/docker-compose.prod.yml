name: vivid-learn

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: datn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: public
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    ports:
      # All interfaces: the router forwards db.nhnhn.cloud:2101 here and Tailscale Funnel
      # (tcp :10000) uses localhost; see docs/deployment.md "Remote database access"
      - "${DB_PORT:-15432}:5432"
    volumes:
      # 18+ keeps data in /var/lib/postgresql/18/docker, so the volume mounts one level up.
      # A volume holding 16 data makes the 18 entrypoint refuse to start; hence the new name.
      - pgdata18:/var/lib/postgresql
      - ./certs:/certs:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datn -d public"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/nhnnhnnnhn/datn-backend:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://datn:${POSTGRES_PASSWORD}@db:5432/public?sslmode=require
      ROOT_PATH: /api
      LOG_TO_CLIENT: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    image: ghcr.io/nhnnhnnnhn/datn-frontend:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    networks:
      default:
      proxy:
        # Nginx Proxy Manager forwards dev-datn.nhnhn.cloud to this name
        aliases: [vivid-learn-frontend]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata18:

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx_default}
